<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vema24 - Update Profile</title>
    <link href="https://cdn.tailwindcss.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-storage-compat.js"></script>
    <style>
        * { font-family: 'Inter', sans-serif; }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .profile-card {
            animation: fadeUp 0.6s ease forwards;
            opacity: 0;
        }
        .profile-card:nth-child(1) { animation-delay: 0.1s; }
        .profile-card:nth-child(2) { animation-delay: 0.2s; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-100 min-h-screen py-8">
    <div class="max-w-4xl mx-auto px-4">
        <!-- Header -->
        <div class="mb-8">
            <a href="dashboard/index.html" class="text-blue-600 hover:text-blue-700 flex items-center space-x-2 font-medium transition-colors">
                <i class="fas fa-arrow-left"></i>
                <span>Back to Dashboard</span>
            </a>
            <h1 class="text-4xl font-bold text-slate-900 mt-4">Update Profile</h1>
            <p class="text-slate-600 mt-2">Manage your account information and preferences</p>
        </div>

        <!-- Profile Container -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Profile Picture Card -->
            <div class="profile-card lg:col-span-1">
                <div class="bg-white rounded-2xl shadow-md p-8 text-center">
                    <div class="mb-6">
                        <div class="w-32 h-32 mx-auto rounded-full bg-gradient-to-br from-blue-400 to-blue-600 flex items-center justify-center text-white overflow-hidden shadow-lg border-4 border-blue-100">
                            <img id="profile-pic" src="" alt="Profile" class="w-full h-full object-cover hidden">
                            <i id="default-avatar" class="fas fa-user text-5xl"></i>
                        </div>
                    </div>
                    <h2 id="profile-name" class="text-2xl font-bold text-slate-900 mb-1">Loading...</h2>
                    <p id="profile-email" class="text-slate-600 text-sm mb-6">Loading...</p>

                    <label class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-medium cursor-pointer transition-colors inline-flex items-center space-x-2">
                        <i class="fas fa-camera"></i>
                        <span>Upload Photo</span>
                        <input type="file" id="photo-input" class="hidden" accept="image/*">
                    </label>
                    <p class="text-xs text-slate-500 mt-4">JPG, PNG (Max 5MB)</p>
                </div>
            </div>

            <!-- Profile Form Card -->
            <div class="profile-card lg:col-span-2">
                <div class="bg-white rounded-2xl shadow-md p-8">
                    <h3 class="text-xl font-bold text-slate-900 mb-6 flex items-center space-x-2">
                        <i class="fas fa-user-edit text-blue-600"></i>
                        <span>Personal Information</span>
                    </h3>

                    <form id="profile-form" class="space-y-6">
                        <!-- Name -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-2">
                                    <i class="fas fa-user mr-2 text-blue-600"></i>First Name
                                </label>
                                <input type="text" id="first-name" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all" placeholder="John">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-2">
                                    <i class="fas fa-user mr-2 text-blue-600"></i>Last Name
                                </label>
                                <input type="text" id="last-name" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all" placeholder="Doe">
                            </div>
                        </div>

                        <!-- Email & Phone -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-2">
                                    <i class="fas fa-envelope mr-2 text-blue-600"></i>Email Address
                                </label>
                                <input type="email" id="email" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all" placeholder="john@example.com" readonly>
                                <p class="text-xs text-slate-500 mt-1">Cannot be changed</p>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-2">
                                    <i class="fas fa-phone mr-2 text-blue-600"></i>Phone Number
                                </label>
                                <input type="tel" id="phone" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all" placeholder="+27 123 456 7890">
                            </div>
                        </div>

                        <!-- Address -->
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">
                                <i class="fas fa-map-marker-alt mr-2 text-blue-600"></i>Address
                            </label>
                            <input type="text" id="address" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all" placeholder="123 Main Street, City, Country">
                        </div>

                        <!-- City & Country -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-2">
                                    <i class="fas fa-city mr-2 text-blue-600"></i>City
                                </label>
                                <input type="text" id="city" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all" placeholder="Johannesburg">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-2">
                                    <i class="fas fa-globe mr-2 text-blue-600"></i>Country
                                </label>
                                <input type="text" id="country" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all" placeholder="South Africa">
                            </div>
                        </div>

                        <!-- Bio -->
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">
                                <i class="fas fa-pen mr-2 text-blue-600"></i>Bio
                            </label>
                            <textarea id="bio" rows="4" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all" placeholder="Tell us about yourself..."></textarea>
                        </div>

                        <!-- Save Button -->
                        <div class="flex space-x-4 pt-4">
                            <button type="submit" class="flex-1 bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white px-6 py-3 rounded-lg font-medium transition-all shadow-md hover:shadow-lg flex items-center justify-center space-x-2">
                                <i class="fas fa-save"></i>
                                <span>Save Changes</span>
                            </button>
                            <button type="button" id="cancel-btn" class="px-6 py-3 border border-slate-300 rounded-lg font-medium text-slate-700 hover:bg-slate-50 transition-colors">
                                Cancel
                            </button>
                        </div>
                    </form>

                    <!-- Divider -->
                    <hr class="my-8 border-slate-200">

                    <!-- Password Section -->
                    <h3 class="text-xl font-bold text-slate-900 mb-6 flex items-center space-x-2">
                        <i class="fas fa-lock text-blue-600"></i>
                        <span>Security</span>
                    </h3>

                    <button id="change-password-btn" class="w-full border-2 border-orange-500 text-orange-600 hover:bg-orange-50 px-6 py-3 rounded-lg font-medium transition-colors flex items-center justify-center space-x-2">
                        <i class="fas fa-key"></i>
                        <span>Change Password</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-lg p-8 text-center">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto mb-4"></div>
            <p class="text-slate-700 font-medium">Saving changes...</p>
        </div>
    </div>

    <script src="js/firebase.config.js"></script>
    <script>
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();
        const storage = firebase.storage();

        let currentUser = null;

        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = 'auth/login.html';
                return;
            }
            currentUser = user;
            await loadProfile();
        });

        async function loadProfile() {
            try {
                const userDoc = await db.collection('users').doc(currentUser.uid).get();
                const userData = userDoc.data() || {};

                document.getElementById('profile-name').textContent = userData.firstName + ' ' + userData.lastName || 'Your Name';
                document.getElementById('profile-email').textContent = currentUser.email;
                document.getElementById('first-name').value = userData.firstName || '';
                document.getElementById('last-name').value = userData.lastName || '';
                document.getElementById('email').value = currentUser.email;
                document.getElementById('phone').value = userData.phone || '';
                document.getElementById('address').value = userData.address || '';
                document.getElementById('city').value = userData.city || '';
                document.getElementById('country').value = userData.country || '';
                document.getElementById('bio').value = userData.bio || '';

                if (userData.profilePicture) {
                    document.getElementById('profile-pic').src = userData.profilePicture;
                    document.getElementById('profile-pic').classList.remove('hidden');
                    document.getElementById('default-avatar').classList.add('hidden');
                }
            } catch (error) {
                console.error('Error loading profile:', error);
            }
        }

        document.getElementById('profile-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            document.getElementById('loading-overlay').classList.remove('hidden');

            try {
                await db.collection('users').doc(currentUser.uid).update({
                    firstName: document.getElementById('first-name').value,
                    lastName: document.getElementById('last-name').value,
                    phone: document.getElementById('phone').value,
                    address: document.getElementById('address').value,
                    city: document.getElementById('city').value,
                    country: document.getElementById('country').value,
                    bio: document.getElementById('bio').value,
                    updatedAt: new Date()
                });

                document.getElementById('loading-overlay').classList.add('hidden');
                alert('Profile updated successfully!');
            } catch (error) {
                document.getElementById('loading-overlay').classList.add('hidden');
                alert('Error updating profile: ' + error.message);
            }
        });

        document.getElementById('cancel-btn').addEventListener('click', () => {
            window.location.href = 'dashboard/index.html';
        });

        document.getElementById('change-password-btn').addEventListener('click', () => {
            alert('Redirect to password change page');
        });

        document.getElementById('photo-input').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (file.size > 5 * 1024 * 1024) {
                alert('File size must be less than 5MB');
                return;
            }

            document.getElementById('loading-overlay').classList.remove('hidden');

            try {
                const ref = storage.ref('profiles/' + currentUser.uid + '/photo');
                await ref.put(file);
                const url = await ref.getDownloadURL();

                await db.collection('users').doc(currentUser.uid).update({
                    profilePicture: url
                });

                document.getElementById('profile-pic').src = url;
                document.getElementById('profile-pic').classList.remove('hidden');
                document.getElementById('default-avatar').classList.add('hidden');

                document.getElementById('loading-overlay').classList.add('hidden');
                alert('Profile picture updated!');
            } catch (error) {
                document.getElementById('loading-overlay').classList.add('hidden');
                alert('Error uploading photo: ' + error.message);
            }
        });
    </script>
</body>
</html>
