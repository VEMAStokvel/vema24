<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vema Stokvel - My Stokvels</title>
    <link href="https://cdn.tailwindcss.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore-compat.js"></script>
    <style>
        * { font-family: 'Inter', sans-serif; }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-15px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .table-row-item {
            animation: fadeUp 0.5s ease forwards;
            opacity: 0;
        }
        .table-row-item:nth-child(1) { animation-delay: 0.1s; }
        .table-row-item:nth-child(2) { animation-delay: 0.15s; }
        .table-row-item:nth-child(3) { animation-delay: 0.2s; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-100 min-h-screen">
    <!-- Mobile Menu Button -->
    <div class="md:hidden fixed top-0 left-0 z-30 w-full bg-gradient-to-r from-blue-800 to-blue-900 text-white p-4 flex justify-between items-center shadow-lg">
        <div class="flex items-center space-x-2">
            <i class="fas fa-wallet text-xl"></i>
            <span class="font-bold">Vema24</span>
        </div>
        <button id="mobile-menu-button" class="text-white focus:outline-none">
            <i class="fas fa-bars text-xl"></i>
        </button>
    </div>

    <!-- Sidebar Navigation -->
    <div class="flex h-screen">
        <div id="sidebar" class="bg-gradient-to-b from-blue-800 to-blue-900 text-white w-64 flex-shrink-0 fixed md:relative transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out z-40 h-full overflow-y-auto shadow-2xl">
            <div class="p-6 flex items-center space-x-3 border-b border-blue-700">
                <i class="fas fa-wallet text-2xl"></i>
                <h2 class="font-bold text-lg">Vema24</h2>
            </div>
            <nav class="mt-6 space-y-2 px-4">
                <a href="index.html" class="block px-4 py-3 rounded-lg hover:bg-blue-700 transition-colors flex items-center space-x-3">
                    <i class="fas fa-home w-5"></i>
                    <span>Dashboard</span>
                </a>
                <a href="stokvel.html" class="block px-4 py-3 rounded-lg bg-blue-700 text-white flex items-center space-x-3">
                    <i class="fas fa-piggy-bank w-5"></i>
                    <span>My Stokvels</span>
                </a>
                <a href="profile.html" class="block px-4 py-3 rounded-lg hover:bg-blue-700 transition-colors flex items-center space-x-3">
                    <i class="fas fa-user-circle w-5"></i>
                    <span>Profile</span>
                </a>
                <a href="#" id="logout-btn" class="block px-4 py-3 rounded-lg hover:bg-red-600 transition-colors flex items-center space-x-3">
                    <i class="fas fa-sign-out-alt w-5"></i>
                    <span>Logout</span>
                </a>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="flex-1 overflow-auto md:ml-0 mt-16 md:mt-0">
            <!-- Top Bar -->
            <header class="bg-white shadow-sm border-b border-slate-200 p-6 sticky top-0 z-20">
                <div class="flex justify-between items-center">
                    <div>
                        <h1 class="text-3xl font-bold text-slate-900">My Stokvels</h1>
                        <p class="text-slate-600 mt-1">Manage and track your savings</p>
                    </div>
                    <button id="create-stokvel-btn" class="bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white px-6 py-3 rounded-lg font-medium transition-all shadow-md hover:shadow-lg flex items-center space-x-2">
                        <i class="fas fa-plus"></i>
                        <span>Join Stokvel</span>
                    </button>
                </div>
            </header>

            <!-- Main Content -->
            <main class="p-6 max-w-7xl mx-auto">
                <!-- Loading State -->
                <div id="loading-container" class="flex justify-center items-center py-12">
                    <div class="text-center">
                        <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-blue-100 mb-4">
                            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
                        </div>
                        <p class="text-slate-600">Loading your stokvels...</p>
                    </div>
                </div>

                <!-- Stokvels Table -->
                <div id="stokvels-container" class="bg-white rounded-lg shadow-md overflow-hidden hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full divide-y divide-slate-200">
                            <thead class="bg-gradient-to-r from-slate-50 to-slate-100">
                                <tr>
                                    <th class="px-6 py-4 text-left text-xs font-semibold text-slate-700 uppercase tracking-wide">Stokvel Name</th>
                                    <th class="px-6 py-4 text-left text-xs font-semibold text-slate-700 uppercase tracking-wide hidden sm:table-cell">Type</th>
                                    <th class="px-6 py-4 text-left text-xs font-semibold text-slate-700 uppercase tracking-wide">Balance</th>
                                    <th class="px-6 py-4 text-left text-xs font-semibold text-slate-700 uppercase tracking-wide hidden md:table-cell">Next Contribution</th>
                                    <th class="px-6 py-4 text-left text-xs font-semibold text-slate-700 uppercase tracking-wide hidden sm:table-cell">Status</th>
                                    <th class="px-6 py-4 text-left text-xs font-semibold text-slate-700 uppercase tracking-wide">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="stokvels-body" class="divide-y divide-slate-200">
                                <!-- Rows populated by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Empty State -->
                <div id="empty-state" class="text-center py-12 bg-white rounded-lg shadow-md">
                    <i class="fas fa-inbox text-5xl text-slate-300 mb-4"></i>
                    <h3 class="text-xl font-semibold text-slate-800 mb-2">No Stokvels Yet</h3>
                    <p class="text-slate-600 mb-6">Join a stokvel to start saving with others</p>
                    <button id="join-btn-empty" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium transition-colors">
                        Join a Stokvel
                    </button>
                </div>
            </main>
        </div>
    </div>

    <script src="../js/firebase.config.js"></script>
    <script>
        let currentUser = null;

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Check auth state
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = '../auth/login.html';
                return;
            }
            currentUser = user;
            await loadStorkvels();
        });

        // Toggle mobile menu
        document.getElementById('mobile-menu-button').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
        });

        // Logout
        document.getElementById('logout-btn').addEventListener('click', async () => {
            await auth.signOut();
            window.location.href = '../auth/login.html';
        });

        async function loadStorkvels() {
            try {
                const loadingContainer = document.getElementById('loading-container');
                const stokvelsContainer = document.getElementById('stokvels-container');
                const emptyState = document.getElementById('empty-state');
                const tbody = document.getElementById('stokvels-body');

                const userDoc = await db.collection('users').doc(currentUser.uid).get();
                const stokvels = userDoc.data()?.stokvels || [];

                if (stokvels.length === 0) {
                    loadingContainer.classList.add('hidden');
                    stokvelsContainer.classList.add('hidden');
                    emptyState.classList.remove('hidden');
                    return;
                }

                tbody.innerHTML = '';
                stokvels.forEach((stokvel, idx) => {
                    const row = document.createElement('tr');
                    row.className = 'table-row-item hover:bg-slate-50 transition-colors';
                    row.innerHTML = `
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="flex items-center space-x-3">
                                <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center">
                                    <span class="text-blue-600 font-semibold">${stokvel.name.charAt(0)}</span>
                                </div>
                                <span class="font-medium text-slate-900">${stokvel.name}</span>
                            </div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap hidden sm:table-cell text-sm text-slate-600">${stokvel.type || 'Fixed'}</td>
                        <td class="px-6 py-4 whitespace-nowrap font-semibold text-slate-900">R ${(stokvel.balance || 0).toLocaleString()}</td>
                        <td class="px-6 py-4 whitespace-nowrap hidden md:table-cell text-sm text-slate-600">${stokvel.nextContribution || 'N/A'}</td>
                        <td class="px-6 py-4 whitespace-nowrap hidden sm:table-cell">
                            <span class="inline-block px-3 py-1 rounded-full text-xs font-semibold ${stokvel.active ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'}">
                                ${stokvel.active ? 'Active' : 'Pending'}
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <button class="text-blue-600 hover:text-blue-800 font-medium text-sm transition-colors">Details</button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });

                loadingContainer.classList.add('hidden');
                stokvelsContainer.classList.remove('hidden');
                emptyState.classList.add('hidden');
            } catch (error) {
                console.error('Error loading stokvels:', error);
                document.getElementById('loading-container').innerHTML = `
                    <div class="text-center text-red-600">
                        <p>Error loading stokvels. Please try again.</p>
                    </div>
                `;
            }
        }

        // Join stokvel buttons
        document.getElementById('create-stokvel-btn').addEventListener('click', () => {
            alert('Join Stokvel modal would open here');
        });
        document.getElementById('join-btn-empty').addEventListener('click', () => {
            alert('Join Stokvel modal would open here');
        });
    </script>
</body>
</html>
