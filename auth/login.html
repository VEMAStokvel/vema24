<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vema24 — Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="../css/auth-pages.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore-compat.js"></script>
    <style>* { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }</style>
</head>
<body class="auth-bg antialiased text-slate-800 relative">
    <div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden" aria-hidden="true">
        <div class="absolute -top-32 -right-24 h-[420px] w-[420px] rounded-full bg-blue-400/15 blur-3xl"></div>
        <div class="absolute -bottom-28 -left-20 h-[380px] w-[380px] rounded-full bg-violet-400/12 blur-3xl"></div>
    </div>

    <!-- Loading screen -->
    <div id="loading-screen" class="auth-loading-overlay fixed inset-0 z-[110] flex items-center justify-center">
        <div class="text-center">
            <div class="mx-auto mb-4 h-12 w-12 animate-spin rounded-full border-2 border-blue-200 border-t-blue-600"></div>
            <p class="font-medium text-slate-600">Checking authentication…</p>
        </div>
    </div>

    <nav class="auth-nav-shell" aria-label="Sign in">
        <div class="auth-nav-inner">
            <div class="auth-nav-pill">
                <a href="../index.html" class="flex min-w-0 shrink-0 items-center gap-2 pr-0.5" aria-label="Vema24 home">
                    <span class="auth-logo-ring" aria-hidden="true">
                        <img src="../assets/logo/Vema White.png" alt="" width="22" height="22">
                    </span>
                    <span class="auth-wordmark text-[0.95rem] sm:text-base">Vema24</span>
                </a>
                <div class="auth-nav-actions">
                    <a href="../index.html" class="auth-link-muted hidden sm:inline">Home</a>
                    <a href="register.html" class="auth-cta-pill !text-[0.78rem] !py-2 !px-3.5">
                        Join <i class="fas fa-arrow-right text-[10px] opacity-90"></i>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div id="main-content" class="hidden px-4 pb-16 pt-24 sm:px-6 sm:pt-28">
        <div class="auth-card mx-auto w-full max-w-md p-8 sm:p-10">
            <div class="mb-8 text-center">
                <h1 class="text-2xl font-bold tracking-tight text-slate-900 sm:text-3xl">Welcome back</h1>
                <p class="mt-2 text-sm text-slate-600">Sign in to your Vema24 account</p>
                <div id="login-reason" class="mt-4 hidden rounded-xl border border-blue-100 bg-blue-50/90 p-3 text-left">
                    <p class="text-sm text-blue-800">
                        <i class="fas fa-info-circle mr-2 opacity-80"></i>
                        <span id="login-reason-text">Please sign in to continue</span>
                    </p>
                </div>
            </div>

            <div id="error-message" class="mb-4 hidden rounded-xl border border-red-100 bg-red-50 p-3 text-sm text-red-800"></div>

            <form id="login-form" class="space-y-5">
                <div>
                    <label for="email" class="mb-1.5 block text-xs font-semibold uppercase tracking-wide text-slate-500">Email</label>
                    <input type="email" id="email" name="email" required autocomplete="email"
                        class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-900 placeholder:text-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20">
                </div>
                <div>
                    <label for="password" class="mb-1.5 block text-xs font-semibold uppercase tracking-wide text-slate-500">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password"
                        class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-900 placeholder:text-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20">
                    <a href="reset-password.html" class="mt-2 inline-block text-sm font-semibold text-blue-600 hover:text-blue-700">Forgot password?</a>
                </div>
                <button type="submit" id="login-button"
                    class="relative flex w-full items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-blue-600 to-violet-600 py-3.5 text-sm font-semibold text-white shadow-lg shadow-blue-600/25 transition hover:opacity-[0.97] disabled:opacity-60">
                    <span id="button-text">Sign in</span>
                    <span id="button-spinner" class="hidden">
                        <svg class="h-5 w-5 animate-spin text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </span>
                </button>
            </form>

            <p class="mt-8 border-t border-slate-100 pt-6 text-center text-sm text-slate-600">
                Don’t have an account?
                <a href="register.html" class="font-semibold text-blue-600 hover:text-blue-700">Create one</a>
            </p>
        </div>
    </div>

    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAEik5dGton3H4LyGDzYbNrw6GwutGNOqk",
            authDomain: "vema-7606a.firebaseapp.com",
            projectId: "vema-7606a",
            storageBucket: "vema-7606a.firebasestorage.app",
            messagingSenderId: "127492940070",
            appId: "1:127492940070:web:ddf247a2cb0723ddcbe1e7",
            measurementId: "G-2E6VC65Q3K"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        try {
            db.settings({
                experimentalForceLongPolling: true,
                experimentalLongPollingOptions: { timeoutSeconds: 25 },
            });
        } catch (e) {
            console.warn('Firestore settings:', e);
        }

        // Check for intended action and show reason
        document.addEventListener('DOMContentLoaded', function() {
            // Check URL parameters first, then sessionStorage
            const urlParams = new URLSearchParams(window.location.search);
            const urlRedirect = urlParams.get('redirect');
            const urlAction = urlParams.get('action');
            
            const intendedAction = urlAction || sessionStorage.getItem('intendedAction');
            const intendedDestination = urlRedirect || sessionStorage.getItem('intendedDestination');
            
            // Store in sessionStorage if from URL params
            if (urlRedirect && !sessionStorage.getItem('intendedDestination')) {
                sessionStorage.setItem('intendedDestination', urlRedirect);
            }
            if (urlAction && !sessionStorage.getItem('intendedAction')) {
                sessionStorage.setItem('intendedAction', urlAction);
            }
            
            const loginReason = document.getElementById('login-reason');
            const loginReasonText = document.getElementById('login-reason-text');
            
            console.log('Page loaded - URL params:', { urlRedirect, urlAction });
            console.log('Page loaded - sessionStorage:', {
                intendedAction,
                intendedDestination
            });
            
            if (intendedAction) {
                loginReasonText.textContent = `Please sign in to ${intendedAction}`;
                loginReason.classList.remove('hidden');
            }
        });

        // Function to get user role
        async function getUserRole(uid) {
            try {
                const userDoc = await db.collection('users').doc(uid).get();
                if (userDoc.exists) {
                    return userDoc.data().role || null;
                }
                return null;
            } catch (error) {
                console.error("Error getting user role:", error);
                return null;
            }
        }

        // Check auth state
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                // User is signed in, check their role
                const userRole = await getUserRole(user.uid);
                
                // Check for intended destination first (check both URL params and sessionStorage)
                const urlParams = new URLSearchParams(window.location.search);
                const urlRedirect = urlParams.get('redirect');
                const intendedDestination = urlRedirect || sessionStorage.getItem('intendedDestination');
                
                console.log('Login success - intended destination:', intendedDestination);
                console.log('URL params:', { urlRedirect });
                console.log('SessionStorage:', sessionStorage.getItem('intendedDestination'));
                
                if (intendedDestination) {
                    // Clear the stored destination and redirect
                    sessionStorage.removeItem('intendedDestination');
                    sessionStorage.removeItem('intendedAction');
                    // Add ../ to go up one level from auth/ folder
                    const redirectPath = intendedDestination.startsWith('../') ? intendedDestination : '../' + intendedDestination;
                    console.log('Redirecting to intended destination:', redirectPath);
                    window.location.href = redirectPath;
                } else {
                    // Redirect based on role
                    console.log('No intended destination, redirecting based on role:', userRole);
                    if (userRole === 'admin') {
                        window.location.href = '../dashboard/admin-dashboard.html';
                    } else if (userRole) {
                        // User has a role but it's not admin
                        window.location.href = '../dashboard/index.html';
                    } else {
                        // User has no role assigned
                        window.location.href = '../dashboard/index.html';
                    }
                }
            } else {
                // User is not signed in, show the form
                document.getElementById('loading-screen').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');
            }
        });

        // Login form submission
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('error-message');
            
            // Show loading state
            document.getElementById('button-text').classList.add('hidden');
            document.getElementById('button-spinner').classList.remove('hidden');
            document.getElementById('login-button').disabled = true;
            
            // Clear previous errors
            errorMessage.classList.add('hidden');
            
            try {
                // Sign in with email and password
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;
                
                // Get user role
                const userRole = await getUserRole(user.uid);
                
                // Check for intended destination first (check both URL params and sessionStorage)
                const urlParams = new URLSearchParams(window.location.search);
                const urlRedirect = urlParams.get('redirect');
                const intendedDestination = urlRedirect || sessionStorage.getItem('intendedDestination');
                
                console.log('Login success - intended destination:', intendedDestination);
                console.log('URL params:', { urlRedirect });
                console.log('SessionStorage:', sessionStorage.getItem('intendedDestination'));
                
                if (intendedDestination) {
                    // Clear the stored destination and redirect
                    sessionStorage.removeItem('intendedDestination');
                    sessionStorage.removeItem('intendedAction');
                    // Add ../ to go up one level from auth/ folder
                    const redirectPath = intendedDestination.startsWith('../') ? intendedDestination : '../' + intendedDestination;
                    console.log('Redirecting to intended destination:', redirectPath);
                    window.location.href = redirectPath;
                } else {
                    // Redirect based on role
                    console.log('No intended destination, redirecting based on role:', userRole);
                    if (userRole === 'admin') {
                        window.location.href = '../dashboard/admin-dashboard.html';
                    } else if (userRole) {
                        // User has a role but it's not admin
                        window.location.href = '../dashboard/index.html';
                    } else {
                        // User has no role assigned
                        window.location.href = '../dashboard/index.html';
                    }
                }
            } catch (error) {
                // Handle errors
                let errorText;
                switch (error.code) {
                    case 'auth/invalid-email':
                        errorText = 'Invalid email address.';
                        break;
                    case 'auth/user-disabled':
                        errorText = 'This account has been disabled.';
                        break;
                    case 'auth/user-not-found':
                        errorText = 'No account found with this email.';
                        break;
                    case 'auth/wrong-password':
                        errorText = 'Incorrect password.';
                        break;
                    default:
                        errorText = 'Login failed. Please try again.';
                }
                
                errorMessage.textContent = errorText;
                errorMessage.classList.remove('hidden');
                
                // Reset button state
                document.getElementById('button-text').classList.remove('hidden');
                document.getElementById('button-spinner').classList.add('hidden');
                document.getElementById('login-button').disabled = false;
            }
        });
    </script>
</body>
</html>
