<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vema24 — Reset password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="../css/auth-pages.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-auth-compat.js"></script>
    <style>* { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }</style>
</head>
<body class="auth-bg antialiased text-slate-800 relative">
    <div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden" aria-hidden="true">
        <div class="absolute -top-32 -right-24 h-[420px] w-[420px] rounded-full bg-blue-400/15 blur-3xl"></div>
        <div class="absolute -bottom-28 -left-20 h-[380px] w-[380px] rounded-full bg-violet-400/12 blur-3xl"></div>
    </div>

    <nav class="auth-nav-shell" aria-label="Reset password">
        <div class="auth-nav-inner max-w-md">
            <div class="auth-nav-pill">
                <a href="../index.html" class="flex min-w-0 shrink-0 items-center gap-2 pr-0.5" aria-label="Vema24 home">
                    <span class="auth-logo-ring" aria-hidden="true">
                        <img src="../assets/logo/Vema White.png" alt="" width="22" height="22">
                    </span>
                    <span class="auth-wordmark text-[0.95rem] sm:text-base">Vema24</span>
                </a>
                <div class="auth-nav-actions">
                    <a href="../index.html" class="auth-link-muted hidden sm:inline">Home</a>
                    <a href="login.html" class="auth-cta-pill !text-[0.78rem] !py-2 !px-3.5">Sign in</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="px-4 pb-16 pt-24 sm:px-6 sm:pt-28">
        <div class="auth-card mx-auto w-full max-w-md p-8 sm:p-10">
            <div class="mb-8 text-center">
                <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-gradient-to-br from-blue-600 to-cyan-600 text-white shadow-lg shadow-blue-600/25">
                    <i class="fas fa-key text-xl"></i>
                </div>
                <h1 class="text-2xl font-bold tracking-tight text-slate-900 sm:text-3xl">Reset password</h1>
                <p class="mt-2 text-sm text-slate-600">We’ll email you a link to choose a new password</p>
            </div>

            <div id="error-message" class="mb-4 hidden rounded-xl border border-red-100 bg-red-50 p-3 text-sm text-red-800"></div>
            <div id="success-message" class="mb-4 hidden rounded-xl border border-emerald-100 bg-emerald-50 p-3 text-sm text-emerald-900"></div>

            <form id="reset-form" class="space-y-5">
                <div>
                    <label for="email" class="mb-1.5 block text-xs font-semibold uppercase tracking-wide text-slate-500">Email</label>
                    <input type="email" id="email" name="email" required autocomplete="email"
                        class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-900 placeholder:text-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20">
                </div>
                <button type="submit" id="reset-button"
                    class="relative flex w-full items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-blue-600 to-violet-600 py-3.5 text-sm font-semibold text-white shadow-lg shadow-blue-600/25 transition hover:opacity-[0.97] disabled:opacity-60">
                    <span id="button-text">Send reset link</span>
                    <span id="button-spinner" class="hidden">
                        <svg class="h-5 w-5 animate-spin text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </span>
                </button>
            </form>

            <p class="mt-8 border-t border-slate-100 pt-6 text-center text-sm text-slate-600">
                <a href="login.html" class="font-semibold text-blue-600 hover:text-blue-700">← Back to sign in</a>
            </p>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAEik5dGton3H4LyGDzYbNrw6GwutGNOqk",
            authDomain: "vema-7606a.firebaseapp.com",
            projectId: "vema-7606a",
            storageBucket: "vema-7606a.firebasestorage.app",
            messagingSenderId: "127492940070",
            appId: "1:127492940070:web:ddf247a2cb0723ddcbe1e7",
            measurementId: "G-2E6VC65Q3K"
          };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        document.getElementById('reset-form').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const errorMessage = document.getElementById('error-message');
            const successMessage = document.getElementById('success-message');
            const resetButton = document.getElementById('reset-button');
            const buttonText = document.getElementById('button-text');
            const buttonSpinner = document.getElementById('button-spinner');
            
            errorMessage.classList.add('hidden');
            successMessage.classList.add('hidden');
            
            buttonText.classList.add('hidden');
            buttonSpinner.classList.remove('hidden');
            resetButton.disabled = true;
            
            auth.sendPasswordResetEmail(email)
                .then(() => {
                    successMessage.innerHTML = `
                        <div class="flex items-start gap-2 text-left">
                            <i class="fas fa-check-circle mt-0.5 text-emerald-600"></i>
                            <div>
                                <strong>Email sent</strong><br>
                                <span class="text-emerald-800/90">Check your inbox and follow the link to reset your password.</span><br>
                                <span class="text-xs font-semibold text-amber-800">If you don’t see it, check spam or junk.</span>
                            </div>
                        </div>
                    `;
                    successMessage.classList.remove('hidden');
                    
                    document.getElementById('email').value = '';
                })
                .catch((error) => {
                    let errorText;
                    switch (error.code) {
                        case 'auth/invalid-email':
                            errorText = 'Please enter a valid email address.';
                            break;
                        case 'auth/user-not-found':
                            errorText = 'No account found with this email address.';
                            break;
                        case 'auth/too-many-requests':
                            errorText = 'Too many reset attempts. Please try again later.';
                            break;
                        default:
                            errorText = 'Failed to send reset email. Please try again.';
                    }
                    
                    errorMessage.innerHTML = `
                        <div class="flex items-center gap-2">
                            <i class="fas fa-exclamation-circle"></i>
                            <span>${errorText}</span>
                        </div>
                    `;
                    errorMessage.classList.remove('hidden');
                })
                .finally(() => {
                    buttonText.classList.remove('hidden');
                    buttonSpinner.classList.add('hidden');
                    resetButton.disabled = false;
                });
        });
    </script>
</body>
</html>
